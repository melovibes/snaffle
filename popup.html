<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Snaffle</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="head">
    <h1>Snaffle</h1>
    <label class="toggle" title="Turn Snaffle on or off">
      <input type="checkbox" id="enabled" aria-label="Snaffle is on">
      <span class="track"><span class="knob"></span></span>
    </label>
  </div>

  <p class="note" id="note" role="status" hidden></p>

  <section>
    <h2>Save what is under the pointer</h2>
    <div class="keys">
      <span class="key" id="keyWrap"><code id="keyLabel">-</code></span>
      <span class="or">or</span>
      <span class="key" id="mouseWrap"><code id="mouseLabel">-</code></span>
    </div>
  </section>

  <section class="acts">
    <button type="button" id="capture">
      <strong>Screenshot the whole page</strong>
      <code id="captureLabel">-</code>
    </button>
    <button type="button" id="gallery">
      <strong>List every image and video</strong>
      <code id="galleryLabel">-</code>
    </button>
  </section>

  <section>
    <h2>Recently saved</h2>
    <ul id="recent" class="recent"></ul>
  </section>

  <div class="foot">
    <span class="dest">Saving to <code id="dest">Downloads</code></span>
    <span class="links">
      <button type="button" id="folder" class="link">Open folder</button>
      <button type="button" id="open" class="link">Settings</button>
    </span>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
