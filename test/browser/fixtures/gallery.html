<!doctype html>
<html><head><meta charset="utf-8"><title>Gallery fixture</title>
<style>body{margin:0}img{width:200px;height:150px}
#tinybg{width:10px;height:10px;background:url(/img/10x10/010101/tinybg.png)}
#bigbg{width:200px;height:150px;background:url(/img/400x300/ab00ab/bigbg.png)}</style></head>
<body>
<img id="one" src="/img/200x150/a10000/one.png">
<img id="two" src="/img/200x150/00a200/two-small.png"
     srcset="/img/200x150/00a200/two-small.png 200w, /img/800x600/00b300/two-large.png 800w" sizes="200px">
<a href="/img/1600x1200/0000c4/three-full.png"><img id="three" src="/img/200x150/0000c4/three-thumb.png"></a>
<img id="icon" style="width:10px;height:10px" src="/img/10x10/050505/icon.png">
<img id="blobby">
<div id="tinybg"></div>
<div id="bigbg"></div>
<iframe src="{{B}}/pages/inner.html" style="width:200px;height:150px;border:0"></iframe>
<script>
  // An image that only exists in this page's memory.
  const c = document.createElement('canvas'); c.width = 120; c.height = 90;
  const g = c.getContext('2d'); g.fillStyle = '#d0d000'; g.fillRect(0, 0, 120, 90);
  c.toBlob((b) => { document.getElementById('blobby').src = URL.createObjectURL(b); document.title = 'Gallery fixture ready'; });
</script>
</body></html>
