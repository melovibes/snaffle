<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Coastline, a photo journal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: #1c2430; --soft: #5b6676; --line: #e4e8ee; --paper: #f7f8fa; --accent: #c2410c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 5; display: flex; align-items: center; gap: 28px;
           padding: 0 32px; background: #ffffffee; border-bottom: 1px solid var(--line); }
  header b { font-size: 17px; letter-spacing: .2px; }
  header b span { color: var(--accent); }
  header nav { display: flex; gap: 20px; color: var(--soft); font-size: 14px; }
  .intro { padding: 96px 32px 8px; max-width: 720px; }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -.3px; }
  .intro p { margin: 0; color: var(--soft); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 24px 32px 40px; }
  figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  figcaption { padding: 10px 14px 12px; }
  figcaption b { display: block; font-size: 14px; }
  figcaption span { color: var(--soft); font-size: 13px; }
  footer { padding: 22px 32px 30px; border-top: 1px solid var(--line); color: var(--soft); font-size: 13px; }
</style></head>
<body>
<header><b>Coast<span>line</span></b><nav><span>Journal</span><span>Places</span><span>Prints</span><span>About</span></nav></header>
<section class="intro">
  <h1>Nine evenings on the north shore</h1>
  <p>A week and a bit of walking the same headland at the same hour, and what the light did each time.</p>
</section>
<section class="grid">
  <figure><a href="/art/1600x1200/0/first-evening.png"><img id="p0" src="/art/560x420/0/first-evening-small.png" alt="Sunset over dark hills"></a>
    <figcaption><b>First evening</b><span>Low cloud burning off at the last minute</span></figcaption></figure>
  <figure><img id="p1" src="/art/560x420/1/morning-after.png" alt="Pale morning over green hills">
    <figcaption><b>The morning after</b><span>Everything rinsed and very green</span></figcaption></figure>
  <figure><img id="p2" src="/art/560x420/2/blue-hour.png" alt="Blue dusk">
    <figcaption><b>Blue hour</b><span>Ten minutes, then gone</span></figcaption></figure>
  <figure><img id="p3" src="/art/560x420/3/dry-spell.png" alt="Warm haze over ochre hills">
    <figcaption><b>Dry spell</b><span>Dust in the air all the way out</span></figcaption></figure>
  <figure><img id="p4" src="/art/560x420/4/after-rain.png" alt="Soft light over forest">
    <figcaption><b>After rain</b><span>The path was a stream by then</span></figcaption></figure>
  <figure><img id="p5" src="/art/560x420/5/high-tide.png" alt="Bright sea-blue sky">
    <figcaption><b>High tide</b><span>Nowhere left to stand</span></figcaption></figure>
  <figure><img id="p6" src="/art/560x420/6/late.png" alt="Purple night sky">
    <figcaption><b>Late</b><span>Walked back by torch</span></figcaption></figure>
  <figure><img id="p7" src="/art/560x420/7/haze.png" alt="Pink haze">
    <figcaption><b>Haze</b><span>The far shore never appeared</span></figcaption></figure>
  <figure><img id="p8" src="/art/560x420/8/last-evening.png" alt="Clear evening over red hills">
    <figcaption><b>Last evening</b><span>Clear from one end to the other</span></figcaption></figure>
</section>
<footer>Coastline is a made-up page used to demonstrate Snaffle. Its pictures are generated by the test server.</footer>
</body></html>
