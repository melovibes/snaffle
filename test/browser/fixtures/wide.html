<!doctype html>
<html><head><meta charset="utf-8"><title>Wide fixture</title>
<style>html,body{margin:0}#sheet{width:2200px;height:1200px;display:grid;grid-template-columns:1100px 1100px;grid-template-rows:600px 600px}</style></head>

  <div style="background:#0000ff"></div><div style="background:#ffff00"></div>
</div>
